name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r apps/api/requirements.txt
        pip install pytest pytest-asyncio pytest-cov ruff
        
    - name: Lint with Ruff
      run: |
        ruff check apps/api/src
        
    - name: Run unit tests
      run: |
        PYTHONPATH=apps/api/src pytest apps/api/tests/unit -v --cov=rag_api

    - name: Run Evals and Check Regression
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        # Only run evals if we have API keys in CI (e.g., not on external PRs)
        if [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
          PYTHONPATH=apps/api/src python eval/run_eval_suite.py --dataset eval/aurora_qa.json --docs-dir eval/aurora_corpus --output eval/current_run.json
          python eval/check_regression.py eval/aurora_baseline.json eval/current_run.json
        else
          echo "Skipping evals due to missing API keys"
        fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd apps/web && npm install && npm run build
