services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
    - qdrant_data:/qdrant/storage
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - echo > /dev/tcp/127.0.0.1/6333
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  api:
    build: apps/api
    ports:
    - ${API_PORT:-8000}:8000
    volumes:
    - hf_cache:/home/appuser/.cache/huggingface
    - fastembed_cache:/home/appuser/.cache/fastembed
    - fastembed_cache:/tmp/fastembed
    environment:
      OMP_NUM_THREADS: 1
      KMP_DUPLICATE_LIB_OK: true
      QDRANT_MODE: http
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-4o}
      COLLECTION_NAME: ${COLLECTION_NAME:-internal_docs}
      DEFAULT_CHUNKING_STRATEGY: ${DEFAULT_CHUNKING_STRATEGY:-structure_aware}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-cross_encoder}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      CITATION_VERIFICATION_ENABLED: ${CITATION_VERIFICATION_ENABLED:-true}
      LOW_CONFIDENCE_THRESHOLD: ${LOW_CONFIDENCE_THRESHOLD:-0.3}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: minioadmin
      OBJECT_STORE_SECRET_KEY: minioadminpassword
      OBJECT_STORE_BUCKET: rag-pipeline-ingest
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped
  seed:
    build: apps/api
    command:
    - python
    - scripts/seed_corpus.py
    volumes:
    - ./scripts:/app/scripts
    - ./eval:/app/eval
    - ./data:/app/data
    environment:
      SEED_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
  frontend:
    build: apps/web
    ports:
    - ${FRONTEND_PORT:-5173}:80
    depends_on:
    - api
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    ports:
    - 9000:9000
    - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
    - minio_data:/data
    restart: unless-stopped
  worker:
    build: apps/api
    command:
    - celery
    - -A
    - rag_api.tasks
    - worker
    - --loglevel=info
    - --concurrency=2
    volumes:
    - hf_cache:/home/appuser/.cache/huggingface
    - fastembed_cache:/home/appuser/.cache/fastembed
    - fastembed_cache:/tmp/fastembed
    environment:
      OMP_NUM_THREADS: 1
      KMP_DUPLICATE_LIB_OK: true
      QDRANT_MODE: http
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-4o}
      COLLECTION_NAME: ${COLLECTION_NAME:-internal_docs}
      DEFAULT_CHUNKING_STRATEGY: ${DEFAULT_CHUNKING_STRATEGY:-structure_aware}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-cross_encoder}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      CITATION_VERIFICATION_ENABLED: ${CITATION_VERIFICATION_ENABLED:-true}
      LOW_CONFIDENCE_THRESHOLD: ${LOW_CONFIDENCE_THRESHOLD:-0.3}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: minioadmin
      OBJECT_STORE_SECRET_KEY: minioadminpassword
      OBJECT_STORE_BUCKET: rag-pipeline-ingest
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
      qdrant:
        condition: service_healthy
    restart: unless-stopped
volumes:
  qdrant_data: null
  hf_cache: null
  fastembed_cache: null
  minio_data: null
