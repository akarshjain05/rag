services:
  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      # The latest chromadb image removed python3/curl/wget, so we use bash TCP to check if the port is open
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    ports:
      # Host port is configurable via .env (API_PORT) -- handy if 8000 is
      # already taken by another project running locally.
      - "${API_PORT:-8000}:8000"
    environment:
      CHROMA_MODE: http
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-4o}
      COLLECTION_NAME: ${COLLECTION_NAME:-internal_docs}
      DEFAULT_CHUNKING_STRATEGY: ${DEFAULT_CHUNKING_STRATEGY:-structure_aware}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-none}
      CITATION_VERIFICATION_ENABLED: ${CITATION_VERIFICATION_ENABLED:-true}
      LOW_CONFIDENCE_THRESHOLD: ${LOW_CONFIDENCE_THRESHOLD:-0.3}
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: ingests the bundled sample corpus (eval/golden_corpus/) once
  # the API is healthy, then exits. Runs automatically on `docker compose
  # up` so a reviewer can start asking real questions immediately, with no
  # manual ingest step. Safe to re-run (checks first, see scripts/seed_corpus.py).
  seed:
    build: .
    command: ["python", "scripts/seed_corpus.py"]
    environment:
      SEED_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  chroma_data:
